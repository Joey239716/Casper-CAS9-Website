<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Instrument+Sans:wght@400..600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      html, body { margin: 0; height: 100%; background: var(--darkfield); overflow: hidden; }
      #stage-wrap { position: fixed; inset: 0; }
      #stage { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 12px; bottom: 10px; margin: 0;
        font: 12px/1.4 system-ui, sans-serif; color: #8c9aad; white-space: pre;
      }
      .hide-hud #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="stage-wrap"><canvas id="stage"></canvas></div>
    <pre id="hud"></pre>
    <script type="module" src="/src/lab.js"></script>
  </body>
</html>
